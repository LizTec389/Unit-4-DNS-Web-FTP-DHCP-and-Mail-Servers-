# Parámetros generales de red
option domain-name "empresa.local";
option domain-name-servers 192.168.100.10, 8.8.8.8;

# Tiempos de concesión (Lease Time en segundos)
default-lease-time 7200;    # 2 horas
max-lease-time 86400;       # 24 horas

# Servidor autoritativo para esta subred
authoritative;

# Declaración de la subred
subnet 192.168.100.0 netmask 255.255.255.0 {
    # Puerta de enlace predeterminada
    option routers 192.168.100.1;
    option subnet-mask 255.255.255.0;
    option broadcast-address 192.168.100.255;

    # Rango de asignación dinámica (192.168.100.50 al 150)
    # Las IPs 1-49 y 151-199 quedan excluidas automáticamente al no incluirse en el pool
    range 192.168.100.50 192.168.100.150;
}

# Reserva estática por dirección MAC
host impresora-vip {
    hardware ethernet 08:00:27:11:22:33;
    fixed-address 192.168.100.200;
    option host-name "impresora.empresa.local";
}
