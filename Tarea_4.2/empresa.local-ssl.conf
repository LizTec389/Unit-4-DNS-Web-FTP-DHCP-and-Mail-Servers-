<VirtualHost *:443>
    ServerName empresa.local
    ServerAlias www.empresa.local
    DocumentRoot /var/www/empresa.local/public_html

    # Activar SSL en este bloque
    SSLEngine on
    SSLCertificateFile      /etc/apache2/ssl/empresa.local.crt
    SSLCertificateKeyFile   /etc/apache2/ssl/empresa.local.key

    # Cabeceras de seguridad
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog ${APACHE_LOG_DIR}/empresa_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/empresa_ssl_access.log combined

    <Directory /var/www/empresa.local/public_html>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# Redirigir HTTP → HTTPS automáticamente
<VirtualHost *:80>
    ServerName empresa.local
    Redirect permanent / https://empresa.local/
</VirtualHost>
