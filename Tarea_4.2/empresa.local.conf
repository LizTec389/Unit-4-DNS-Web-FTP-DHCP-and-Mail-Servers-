<VirtualHost *:80>
    ServerName empresa.local
    ServerAlias www.empresa.local
    DocumentRoot /var/www/empresa.local/public_html

    # Logs separados por sitio
    ErrorLog ${APACHE_LOG_DIR}/empresa_error.log
    CustomLog ${APACHE_LOG_DIR}/empresa_access.log combined

    # Configuración del directorio raíz
    <Directory /var/www/empresa.local/public_html>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
