# Configuración vsftpd - Servidor FTP Corporativo
# Práctica 4.2 - Servicios de Red

# Correr como daemon standalone (NO inetd)
listen=YES
listen_ipv6=NO

# ── ACCESO ──────────────────────────────────────────
# Desactivar acceso anónimo (SEGURIDAD)
anonymous_enable=NO

# Permitir usuarios locales del sistema
local_enable=YES

# Permitir subida de archivos
write_enable=YES

# Permisos de archivos subidos (022 = rw-r--r--)
local_umask=022

# ── MENSAJES Y LOGS ──────────────────────────────────
# Activar mensajes al entrar a directorios
dirmessage_enable=YES

# Usar hora local en listados
use_localtime=YES

# Registrar subidas y descargas
xferlog_enable=YES

# Puerto de datos estándar FTP
connect_from_port_20=YES

# ── CHROOT JAIL ──────────────────────────────────────
# Encerrar usuarios en su carpeta home (aislamiento)
chroot_local_user=YES

# La carpeta raíz del jail NO debe ser escribible por el usuario
allow_writeable_chroot=NO

# ── LISTA BLANCA DE USUARIOS ─────────────────────────
# Solo los usuarios en el archivo pueden conectarse
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

# ── MODO PASIVO ──────────────────────────────────────
# Necesario para clientes detrás de NAT/firewall
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=50000

# ── SSL/TLS (FTPS) ───────────────────────────────────
# Usar el certificado generado para Apache
ssl_enable=YES
rsa_cert_file=/etc/apache2/ssl/empresa.local.crt
rsa_private_key_file=/etc/apache2/ssl/empresa.local.key

# Forzar SSL en login y transferencia de datos
force_local_logins_ssl=YES
force_local_data_ssl=YES

# Solo TLS v1, deshabilitar versiones inseguras
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO

# ── CONFIGURACIÓN DEL SISTEMA ────────────────────────
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
